---

name: Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  HELM_VERSION: '3.6.3'

jobs:

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - 
        name: Checkout repo
        uses: actions/checkout@v6
      -
        name: Configure helm
        uses: azure/setup-helm@v4
        with:
          version: '${{ env.HELM_VERSION }}'
      -
        name: Lint chart
        run: helm lint
